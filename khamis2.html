<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>الطالب · فانوس خامس ٢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Lalezar&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen night-sky classroom game. A map of three gates; each gate is a run of short challenges (screen, paper, performance).
   A scoreboard of 1-8 teams or students tracks four marks: correctness, speed, behavior, tidiness. Deliberately single (dark) theme. */
:root{
  --sky:#006166; --sky2:#00575C; --panel:#004C50; --deep:#003C40; --ink:#FFFFFF; --muted:#B4DCD9; --line:#1E7E82;
  --gold:#00D47D; --g1:#00D47D; --g2:#7DF0BE; --g3:#FFFFFF; --shadow:#008F55;
  --good:#00D47D; --bad:#FF6B6B; --on:#003C40;
  --f-display:"Lalezar","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro",Tahoma,system-ui,sans-serif;
  --f-quran:"Amiri Quran","Amiri","Traditional Arabic",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{direction:rtl;background:radial-gradient(ellipse at 50% -10%,#0A777C,var(--sky) 60%) fixed;background-color:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:20px;line-height:1.7;padding-inline:16px;padding-block:0 32px;overflow-x:hidden}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.small{font-size:.85rem;color:var(--muted)}

/* scoreboard bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-direction:column;gap:8px;padding-block:10px;background:linear-gradient(var(--sky) 80%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:flex;align-items:center;gap:8px;border-radius:16px;padding:4px 12px;background:var(--panel);border:3px solid transparent;font-size:.95rem;min-width:0;transition:transform .25s}
.pchip .dot{width:12px;height:12px;border-radius:50%;flex:none}
.pchip .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.pchip .sc{font-family:var(--f-display);font-size:1.4rem;line-height:1;font-variant-numeric:tabular-nums}
.pchip.turn{transform:scale(1.06)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:4px 12px;font-size:.85rem;font-weight:700}
.tbtn.on{background:var(--gold);color:var(--on);border-color:var(--gold)}
.meter{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.meter .m{width:120px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter .m div{height:100%;width:0;background:var(--good);transition:width .1s}

.screen{display:flex;flex-direction:column;gap:18px;animation:in .4s ease}
@keyframes in{from{opacity:.4;transform:translateY(12px)}to{opacity:1;transform:none}}

/* setup */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:14px}
.hero h1{font-size:clamp(2.6rem,9vw,4.6rem);color:var(--gold);text-shadow:0 4px 0 #003C40,0 0 40px #00D47D55}
.seg{display:inline-flex;background:var(--panel);border-radius:18px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:14px;padding:8px 22px;font-family:var(--f-display);font-size:1.4rem}
.seg button.on{background:var(--gold);color:var(--on)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;width:100%;max-width:820px}
.prow{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:14px;padding:6px 10px}
.prow .dot{width:16px;height:16px;border-radius:50%;flex:none}
.prow input{flex:1;min-width:0;font:inherit;font-size:1rem;background:var(--deep);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.prow button{border:0;background:transparent;color:var(--muted);font-size:1.2rem;padding:0 6px}
.big{border:0;border-radius:20px;padding:12px 32px;font-family:var(--f-display);font-size:1.6rem;background:var(--gold);color:var(--on);box-shadow:0 6px 0 var(--shadow);transition:transform .1s,box-shadow .1s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.big.alt{background:var(--panel);color:var(--ink);box-shadow:0 6px 0 #00292C}
.big[disabled]{opacity:.5}
.guide{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px 18px;text-align:start}
.lantern{flex:none;width:60px;height:60px}
.logo{width:min(220px,55vw);height:auto}
.logo.sm{width:130px}
.bulk{display:flex;flex-direction:column;gap:8px;width:100%;max-width:820px}
.bulk textarea{font:inherit;font-size:1rem;background:var(--deep);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:90px;width:100%}
.count{color:var(--muted);font-size:.9rem}
.cin{font:inherit;font-size:1.1rem;background:var(--deep);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0;flex:1 1 160px}
.code{font-family:var(--f-display);font-size:3rem;letter-spacing:.12em;color:var(--gold);direction:ltr;background:var(--deep);border-radius:18px;padding:6px 22px;font-variant-numeric:tabular-nums}
.reg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:var(--panel);border:2px solid var(--gold);border-radius:22px;padding:16px;width:100%;max-width:820px;text-align:start}
@media (max-width:560px){.reg{grid-template-columns:1fr;justify-items:center;text-align:center}}
#qr{background:#fff;padding:10px;border-radius:14px;width:220px;height:220px}
#qr svg{width:200px;height:200px;display:block}
.share{position:relative;align-self:flex-start}
.shareMenu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:30;background:#fff;color:#003C40;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;min-width:230px;padding:6px;white-space:nowrap}
.shareMenu[hidden]{display:none}
.shareMenu button{all:unset;cursor:pointer;padding:11px 14px;border-radius:10px;font:inherit;font-weight:700;text-align:start}
.shareMenu button:hover,.shareMenu button:focus-visible{background:#E3F8EF}

.gid{font-family:var(--f-display);font-size:3.2rem;line-height:1.1;color:var(--gold);letter-spacing:.12em;font-variant-numeric:tabular-nums}
.joined{display:flex;flex-wrap:wrap;gap:6px}
.joined span{background:var(--deep);border-radius:10px;padding:2px 10px;font-size:.9rem}
.join{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:420px}
.join input{font:inherit;font-size:1.4rem;text-align:center;background:var(--deep);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:10px;width:100%}
.me{font-family:var(--f-display);font-size:3rem;color:var(--gold)}
.more{border:1px dashed var(--line);background:transparent;border-radius:16px;padding:4px 12px;font-size:.85rem;font-weight:700}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:820px}
@media (max-width:700px){.rules{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rules div{background:var(--panel);border-radius:16px;padding:10px;font-size:.9rem}
.rules b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.3rem}

/* map */
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end}
@media (max-width:760px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gate{position:relative;border-radius:120px 120px 22px 22px;padding:22px 12px 16px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;text-align:center;background:var(--panel);border:3px solid var(--line);transition:transform .2s}
.gate:not([disabled]):hover{transform:translateY(-6px)}
.gate[disabled]{opacity:.45;cursor:not-allowed}
.gate .lvl{font-size:.85rem;color:var(--muted)}
.gate .q{font-family:var(--f-display);font-size:1.8rem;line-height:1.2}
.gate .badge{position:absolute;top:12px;font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 12px;background:var(--good);color:var(--on)}
.gate.l1{border-color:var(--g1)} .gate.l1 .q{color:var(--g1)}
.gate.l2{border-color:var(--g2)} .gate.l2 .q{color:var(--g2)}
.gate.l3{border-color:var(--g3)} .gate.l3 .q{color:var(--g3)}
.gate.l4{border-color:var(--gold)} .gate.l4 .q{color:var(--gold)}
.gate.next{animation:glow 1.6s infinite alternate}
@keyframes glow{to{box-shadow:0 0 34px 4px var(--gold)}}
.art{width:100px;height:100px}
.maprow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}

/* challenge */
.turnbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{border-radius:999px;padding:6px 18px;font-weight:700;color:var(--on);display:flex;gap:8px;align-items:center}
.who select{font:inherit;font-size:.9rem;border:0;border-radius:10px;padding:2px 6px;background:#ffffffcc;color:var(--on)}
.kind{border-radius:999px;padding:4px 14px;font-weight:700;font-size:.9rem;background:var(--deep);border:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px}
.prompt{font-size:2.1rem;font-family:var(--f-display);font-weight:400;line-height:1.4;text-align:center}
.timer{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.timer div{height:100%;background:var(--gold);width:100%}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.opt{border:3px solid var(--line);background:var(--sky2);border-radius:22px;padding:20px 14px;text-align:center;font-family:var(--f-display);font-size:2rem;line-height:1.3}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt.right{border-color:var(--good);background:#00704A}
.opt.wrong{border-color:var(--bad);background:#5A2A33;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:12px;border-radius:16px;border:2px dashed var(--line);background:var(--deep);align-items:center}
.slot{border-radius:12px;padding:4px 14px;background:var(--gold);color:var(--on);font-family:var(--f-display);font-size:1.6rem;animation:pop .3s}
.slots.quran .slot{font-family:var(--f-quran);font-size:2rem;line-height:1.9}
@keyframes pop{from{transform:scale(.6)}to{transform:none}}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{border:3px solid var(--line);background:var(--sky2);border-radius:18px;padding:10px 22px;font-family:var(--f-display);font-size:1.7rem}
.tile.quran{font-family:var(--f-quran);font-size:2.2rem;line-height:1.8}
.tile.used{visibility:hidden}
.tile.wrong{border-color:var(--bad);animation:shake .4s}
.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bin{border:3px solid var(--line);border-radius:18px;padding:12px;min-height:150px;background:var(--deep);display:flex;flex-direction:column;gap:8px;text-align:start}
.bin h3{font-size:1.8rem}
.bin.i{border-color:var(--g2)} .bin.i h3{color:var(--g2)}
.bin.m{border-color:var(--g3)} .bin.m h3{color:var(--g3)}
.bin .bchips{display:flex;flex-wrap:wrap;gap:6px}
.bin .bchips span{border-radius:10px;padding:2px 10px;background:var(--sky2);font-size:1rem}
.current{align-self:center;font-family:var(--f-display);font-size:2.6rem;padding:8px 26px;border-radius:18px;background:var(--gold);color:var(--on);animation:pop .3s}
.temple{display:flex;flex-direction:column;gap:6px;max-width:520px;width:100%;margin-inline:auto}
.roof{height:46px;background:var(--g2);clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.18;transition:opacity .6s}
.roof.done{opacity:1}
.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.col{height:150px;border-radius:8px 8px 3px 3px;border:2px dashed var(--line);display:flex;align-items:flex-end;justify-content:center;padding:6px 2px;font-size:1rem;font-weight:700;text-align:center;line-height:1.3}
.col.on{background:var(--g2);border-style:solid;border-color:var(--g2);color:var(--on)}
.base{height:14px;border-radius:4px;background:var(--line)}
.paper{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.paper .sheet{width:min(100%,520px);background:#F7F4EA;color:#2A2A2A;border-radius:6px;padding:22px 24px;font-family:var(--f-display);font-size:1.7rem;line-height:1.6;box-shadow:0 10px 0 -4px #d9d2bd,0 18px 30px #0006;background-image:repeating-linear-gradient(transparent 0 46px,#c9d6ea 46px 48px)}
.grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
@media (max-width:600px){.grade{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grade button{border:3px solid var(--line);background:var(--sky2);border-radius:18px;padding:12px 6px;font-family:var(--f-display);font-size:1.4rem;line-height:1.3}
.grade button small{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--muted)}
.proof{border-radius:18px;padding:14px 18px;background:var(--deep);border:1px solid var(--gold);display:flex;flex-direction:column;gap:4px}
.proof .lbl{color:var(--gold);font-weight:700;font-size:.9rem}
.proof .t{font-family:var(--f-quran);font-size:2rem;line-height:2.1}
.proof .t.h{font-family:var(--f-display);font-size:1.6rem;line-height:1.7}
.proof .ref{color:var(--muted);font-size:.85rem}
.result{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gain{display:flex;gap:8px;flex-wrap:wrap}
.gain span{border-radius:12px;padding:4px 12px;font-weight:700;background:var(--deep)}
.gain .ok{color:var(--good)} .gain .no{color:var(--bad)}

/* drawers */
.drawer{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.drawer h3{font-size:1.5rem}
.brows{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;background:var(--deep);border-radius:14px;padding:6px 10px}
.brow .nm{display:flex;gap:8px;align-items:center;font-weight:700;min-width:0}
.brow .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow button{border:0;border-radius:10px;padding:4px 14px;font-weight:700;font-size:1.2rem}
.plus{background:var(--good);color:var(--on)} .minus{background:var(--bad);color:var(--on)}
.bval{font-family:var(--f-display);font-size:1.3rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.tidy{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tcard{background:var(--deep);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tcard label.up{border:2px dashed var(--line);border-radius:12px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.9rem}
.tcard label.up input{position:absolute;width:1px;height:1px;opacity:0}
.tcard img{width:56px;height:56px;object-fit:cover;border-radius:10px}
.tcard .verdict{font-size:.9rem;color:var(--muted)}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini button{border:1px solid var(--line);background:var(--sky2);border-radius:10px;padding:2px 10px;font-size:.85rem}
.tablewrap{overflow-x:auto;width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.85rem}
td:first-child,th:first-child{text-align:start}
td.tot{font-family:var(--f-display);font-size:1.4rem;color:var(--gold)}
.tdot{display:inline-block;width:12px;height:12px;border-radius:50%}

.story{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-block:10px}
.story h2{font-size:clamp(2rem,6vw,3.2rem)}
.big-q{font-family:var(--f-display);font-size:clamp(2.4rem,8vw,4rem);color:var(--gold)}
.cert{border:6px double var(--gold);border-radius:24px;padding:24px 18px;background:var(--panel);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.cert .champ{font-family:var(--f-display);font-size:clamp(2.2rem,7vw,3.6rem);color:var(--gold)}
.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
@media (max-width:600px){.answers{grid-template-columns:1fr}}
.answers div{border-radius:16px;padding:10px;font-family:var(--f-display);font-size:1.4rem;color:var(--on)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="bar" id="bar" hidden>
    <div class="chips" id="chips"></div>
    <div class="tools">
      <button class="tbtn" id="bMap" type="button">الخريطة</button>
      <button class="tbtn" id="bBeh" type="button">السلوك والصوت</button>
      <button class="tbtn" id="bTidy" type="button">تفتيش الترتيب</button>
      <button class="tbtn" id="bScore" type="button">لوحة التقييم</button>
      <button class="tbtn" id="bCodes" type="button">رموز نتائج الطلاب</button>
      <button class="tbtn" id="bMute" type="button">المؤثرات: تعمل</button>
      <span class="meter" id="meter" hidden><span>الضجيج</span><span class="m"><div id="mLvl"></div></span></span>
    </div>
  </div>
  <div id="panel"></div>
  <div id="app"></div>
</div>

function proofHTML(pr){return '<div class="proof"><span class="lbl">الدليل</span><span class="t'+(pr.h?' h':'')+'">'+pr.t+'</span><span class="ref">'+pr.r+'</span></div>';}
function shuffle(src){let a;do{a=[...src];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}while(a.length>1&&a.every((x,i)=>x===src[i]));return a;}

/* ---------- timers ---------- */
let tId=null;
function runTimer(sec,el,onEnd){clearInterval(tId);const t0=performance.now();let lastTick=-1;
  const st={left:()=>Math.max(0,sec-(performance.now()-t0)/1000),stop:()=>clearInterval(tId)};
  tId=setInterval(()=>{const l=st.left();el.style.width=(l/sec*100)+'%';el.style.background=l<sec*.25?'var(--bad)':'var(--gold)';
    const s=Math.ceil(l);if(l<=5&&s!==lastTick){lastTick=s;sfx.tick();}if(l<=0){clearInterval(tId);onEnd();}},100);
  return st;}

const KIND={mcq:'على الشاشة',verse:'على الشاشة',order:'على الشاشة',temple:'على الشاشة',sort:'على الشاشة',paper:'على الورق',act:'أداء'};
function runLevel(L,i){
  if(i>=L.ch.length)return levelDone(L);
  const c=L.ch[i];const teacher=c.t==='paper'||c.t==='act';
  if(teacher&&S.self)return runLevel(L,i+1);
  app.innerHTML='<section class="screen"><div class="turnbar">'+whoTag()+'<span class="kind">'+KIND[c.t]+'</span><span class="small">'+'★'.repeat(i+1)+'☆'.repeat(L.ch.length-i-1)+'</span></div>'+
   '<div class="card"><div class="timer"><div id="tm"></div></div><p class="prompt">'+(c.t==='paper'?'مهمة على الورق':c.p)+'</p><div id="body"></div><div id="after"></div></div></section>';
  wireWho();
  const body=$('#body'),after=$('#after');let mistakes=0,closed=false;
  const sec=teacher?c.sec:LIMIT[c.t];
  const finish=(correct)=>{
    if(closed)return;closed=true;tm.stop();

/* microphone: if the device refuses it, the teacher's − buttons remain the way to mark noise */
let micStream=null,micRAF=null,lastHit=0;
async function toggleMic(){
  if(S.noiseOn){stopMic();drawPanel();return;}
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(micStream),an=ac.createAnalyser();an.fftSize=1024;src.connect(an);
    const buf=new Uint8Array(an.fftSize);S.noiseOn=true;$('#meter').hidden=false;
    (function loop(){an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const d=(v-128)/128;s+=d*d;}
      const lvl=Math.min(100,Math.sqrt(s/buf.length)*300);const bar=$('#mLvl');bar.style.width=lvl+'%';bar.style.background=lvl>S.thr?'var(--bad)':'var(--good)';
      if(lvl>S.thr&&performance.now()-lastHit>5000){lastHit=performance.now();const p=cur();p.b=Math.max(0,p.b-1);sfx.shh();renderBar();if(open==='beh')drawPanel();}
      micRAF=requestAnimationFrame(loop);})();
    drawPanel();
  }catch(e){stopMic();const m=$('#micMsg');if(m)m.textContent='الميكروفون غير متاح هنا. استخدم زر − عند ارتفاع الصوت.';}

/* tidiness photos: Claude rates them when this page may send images; otherwise the teacher's buttons */
let samplerP=null;
function sampler(){return samplerP||(samplerP=(window.claude?.use?window.claude.use('sample'):Promise.resolve(null)).catch(()=>null));}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1024/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.82);};img.onerror=rej;img.src=URL.createObjectURL(file);});}
async function rateTidy(inp){
  const i=+inp.dataset.i,k=inp.dataset.k,f=inp.files[0];if(!f)return;
  const msg=$('#m'+k+i);const what=k==='tt'?'طاولة':'أرضية';
  const row=inp.closest('.row');row.querySelector('img')?.remove();const th=document.createElement('img');th.alt='';th.src=URL.createObjectURL(f);row.appendChild(th);
  const sample=await sampler();
  const lim=sample?await sample.limits().catch(()=>null):null;
  if(!sample||!lim?.images){msg.textContent='التقييم الآلي غير متاح هنا، اختر الدرجة بالأزرار.';return;}
  msg.textContent='Claude يفحص الصورة…';
  try{
    const blob=await shrink(f);
    const r=await sample.json('الصورة المرفقة يُفترض أنها '+(k==='tt'?'طاولة طالب':'أرضية حول مكان جلوس الطلاب')+' في فصل دراسي للصف الخامس الابتدائي. قيّم النظافة والترتيب بدرجة من 0 إلى 10 (10 = نظيفة ومرتبة تمامًا، 0 = متسخة وفوضوية جدًا)، واكتب سببًا قصيرًا جدًا بالعربية بأسلوب لطيف يشجع الأطفال. إن لم تظهر '+what+' في الصورة فاجعل score قيمة null. أجب بـJSON فقط بهذا الشكل: {"score": 7, "reason": "..."}',{images:[blob],modelTier:'quick'});
    if(typeof r.score==='number'){const p=S.players[i];p[k]=Math.max(0,Math.min(10,Math.round(r.score)));$('#v'+k+i).textContent=p[k];msg.textContent=r.reason||'';renderBar();(p[k]>=7?sfx.ok:sfx.shh)();}
    else msg.textContent=(r.reason?r.reason+' ':'')+'صوّروا مرة أخرى.';
  }catch(e){msg.textContent=e&&e.code==='not_granted'?'لم يُسمح بإرسال الصور، اختر الدرجة بالأزرار.':'تعذر التقييم الآن، اختر الدرجة بالأزرار.';}
}

function copyTxt(t){const ok=()=>true;try{if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(ok,()=>legacyCopy(t));}catch(e){}return Promise.resolve(legacyCopy(t));}

    else if(a==='msg')copyTxt(msg).then(()=>flash('تم نسخ الرسالة ✓'));
    else if(a==='wa')window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener');
    else if(a==='native')navigator.share({title:document.title,text:msg,url:link}).catch(()=>{});};}
function drawQR(){wireShare();const el=$('#qr');if(!el)return;el.innerHTML='';
  try{const q=qrcode(0,'M');q.addData(PAGE_URL+'#'+S.gid);q.make();el.innerHTML=q.createSvgTag({cellSize:6,margin:0,scalable:true}).replace(/fill="black"/g,'fill="#003C40"');}catch(e){el.innerHTML='<p class="small" style="color:#003C40">افتح الرابط واكتب الرقم</p>';}}
function addReg(name){
  name=String(name).trim().slice(0,22);if(!name)return false;
  if(S.reg.some(n=>n===name))return false;
  S.reg.push(name);
  if(S.mode==='solo'&&!S.players.some(p=>p.n===name)&&S.players.length<MAXP()){
    // replace untouched default names first
    const d=S.players.findIndex(p=>/^الطالب \d+$/.test(p.n)&&total(p)===10&&!S.reg.includes(p.n));
    if(d>=0)S.players[d].n=name;else S.players.push(newP(name,S.players.length));
  }
  return true;
}
function renderJoined(){const el=$('#joined');if(!el)return;el.innerHTML=S.reg.map(n=>'<span>'+esc(n)+'</span>').join('');}
async function hostRoom(){
  const st=()=>$('#regStatus');
  const room=await lobby();
  if(!room){if(st())st().textContent='';return;}
  try{
    if(hostR&&hostGid!==S.gid){await hostR.leave().catch(()=>{});hostR=null;}
    if(!hostR){hostR=await room.join('fanoos-'+S.gid);hostGid=S.gid;
      hostR.onPeers(ch=>{let changed=false;
        ch.peers.forEach(pr=>{const pz=pr.presence||{};if(pz.role==='player'&&String(pz.gid)===S.gid&&typeof pz.name==='string'&&addReg(pz.name))changed=true;});
        if(changed){renderJoined();save();sfx.tap();
          const onSetup=!!$('#plist')||!!$('#qr');const typing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
          if(onSetup&&!typing&&S.mode==='solo')setup();else if(!$('#bar').hidden)renderBar();}
        if(st())st().textContent='سجّل '+S.reg.length+' طالبًا';});}
    pushBoard(true);
    if(st())st().textContent=S.reg.length?'سجّل '+S.reg.length+' طالبًا':'بانتظار الطلاب…';
  }catch(e){hostR=null;if(st())st().textContent='تعذر فتح التسجيل الآن، أضف الأسماء يدويًا.';}
}
function pushBoard(force){if(!hostR)return;const now=Date.now();if(!force&&now-boardT<1500)return;boardT=now;
  const board=[...S.players].sort((a,b)=>total(b)-total(a)).slice(0,50).map(p=>[p.n.slice(0,22),total(p)]);
  hostR.presence({role:'host',gid:S.gid,board}).catch(()=>{});}
const pad=(n,w)=>String(Math.max(0,Math.min(10**w-1,n|0))).padStart(w,'0');
function ck(g,c,sp){let h=2166136261;for(const ch of g+'|'+c+'|'+sp+'|fanoos'){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return h%100;}
function makeCode(g,c,sp){const d=pad(c,3)+pad(sp,3)+pad(ck(g,c,sp),2);return d.slice(0,4)+' '+d.slice(4);}
function readCode(d){if(!/^\d{8}$/.test(d))return null;const c=+d.slice(0,3),sp=+d.slice(3,6),k=+d.slice(6);return ck(S.gid,c,sp)===k?{c,sp}:null;}
function startSelf(g,n){S={...S,self:{gid:g,name:n},mode:'solo',players:[newP(n,0)],turn:0,done:[],reg:[],gid:g};
  ['bBeh','bTidy','bCodes'].forEach(id=>$('#'+id).hidden=true);sfx.win();renderBar();map();}
function studentJoin(gid){
  clearInterval(tId);$('#bar').hidden=true;panel.innerHTML='';
  app.innerHTML='<section class="screen hero">'+LOGO.replace('class="logo"','class="logo sm"')+LANTERN+'<h1>فانوس خامس ٢</h1><div class="join">'+
   '<label class="small" for="jg">رقم المسابقة</label><input id="jg" inputmode="numeric" maxlength="4" value="'+esc(gid)+'">'+
   '<label class="small" for="jn">اسمك</label><input id="jn" maxlength="22" autocomplete="off">'+
   '<button class="big" id="jgo" type="button">ابدأ</button><p class="small" id="jmsg"></p></div></section>';
  (gid?$('#jn'):$('#jg')).focus();
  $('#jgo').onclick=async()=>{
    const g=$('#jg').value.trim(),n=$('#jn').value.trim();const msg=$('#jmsg');
    if(!/^\d{4}$/.test(g)){msg.textContent='اكتب رقم المسابقة المكوّن من ٤ أرقام';return;}
    if(!n){msg.textContent='اكتب اسمك';return;}
    startSelf(g,n);
    // also try to register live with the teacher's screen; works only for signed-in invited viewers
    lobby().then(room=>room&&room.join('fanoos-'+g)).then(r=>r&&r.presence({role:'player',gid:g,name:n})).catch(()=>{});
    return;
    app.innerHTML='<section class="screen story">'+LANTERN+'<p class="small">تم تسجيلك في مسابقة '+esc(g)+'</p><div class="me">'+esc(n)+'</div><p class="big-q" id="myScore" style="font-size:2rem">انظر إلى السبورة، المسابقة ستبدأ</p><p class="small" id="myRank"></p></section>';
    r.onPeers(ch=>{const h=ch.peers.find(pr=>pr.presence&&pr.presence.role==='host'&&String(pr.presence.gid)===g);
      const b=h&&Array.isArray(h.presence.board)?h.presence.board:null;if(!b)return;
      const k=b.findIndex(x=>Array.isArray(x)&&x[0]===n);
      if(k>=0){$('#myScore').textContent='نقاطك: '+(+b[k][1]||0);$('#myRank').textContent='ترتيبك '+(k+1)+' من '+b.length;}});
  };
}
const hashGid=(location.hash||'').slice(1);
const boot=d=>{return studentJoin(/^\d{4}$/.test(hashGid)?hashGid:GID);if(d&&d.players){S=d;S.noiseOn=false;S.reg=S.reg||[];S.gid=GID;renderBar();map();hostRoom();}else setup();};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
</script>
